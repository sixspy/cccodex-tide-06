<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>迟到匣 · 潮切</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <aside class="侧轨">
      <div class="侧牌">潮切</div>
      <div class="侧副">物流网点轨迹 · 事件时关窗管道<br/>不是双轨对拍，也不是开腿成对</div>
      <div class="窗条" id="侧窗条">
        <div class="标">当前窗</div>
        <div class="号" id="侧窗号">加载中</div>
        <div class="时" id="侧窗时">—</div>
      </div>
      <div class="时轴">
        <div class="点"><b>装载</b>观测点入流</div>
        <div class="点"><b>入窗</b>事件时进缓冲</div>
        <div class="点"><b>关窗</b>物化切片账</div>
        <div class="点"><b>贯验</b>缓冲↔切片互证</div>
      </div>
      
      <nav class="侧链">
        <a href="/" >潮切台</a>
        <a href="/观测流.html" >观测流</a>
        <a href="/入窗缓冲.html" >入窗缓冲</a>
        <a href="/窗切片账.html" >窗切片账</a>
        <a href="/迟到匣.html" class="亮">迟到匣</a>
        <a href="/窗贯验.html" >窗贯验</a>
        <a href="/网点源.html" >网点源</a>
        <a href="/窗规.html" >窗规</a>
      </nav>

    </aside>
    <main class="主区">
      <header class="页头">
        <h1>迟到匣</h1>
        <p>事件时落在窗外的观测点旁路。基线当场进匣，不入缓冲。</p>
      </header>

      <section class="卷">
        <h2>迟到卡片</h2>
        <p class="说明" id="形"></p>
        <div class="匣格" id="格"></div>
      </section>
      <section class="卷">
        <h2>迟到侧同号对账</h2>
        <div class="表绕"><table><thead><tr><th>事件编号</th><th>现行行数</th><th>迟到行数</th><th>归档行数</th><th>形态</th><th>拒因/归档键</th></tr></thead><tbody id="对账表"></tbody></table></div>
      </section>
      <section class="卷"><div class="双栏"><p class="说明">迟到匣吃出窗事件。空桩「迟到升格回放」可再开，基线只保留旁路。同号再次灌入不会在匣里多一行：封印落拒因，归档把旧行收进只读归档。</p><div class="侧注">行业皮：物流网点。拓扑：单流入窗，不是双轨。</div></div></section>
      <script>
      (async () => {
        const rows = await 潮切.getJSON("/api/迟到匣");
        const 对账 = await 潮切.幂等对账();
        const 账图 = Object.fromEntries(对账.map(x => [x.事件编号, x]));
        const 格 = document.getElementById("格");
        if (!rows.length) { 格.innerHTML = 潮切.空态("迟到匣为空。回潮切台灌迟到样例。"); }
        else for (const r of rows) {
          const 账 = 账图[r.事件编号] || {};
          const 痕 = 账.形态标记 ? `幂等：${潮切.形态徽章(账.形态标记)} ${潮切.安全文本(账.拒因 || 账.归档键 || "任一新号首灌")}` : "幂等：无回执";
          const 卡 = document.createElement("div");
          卡.className = "匣卡";
          卡.innerHTML = `<div class="头"><b>${潮切.安全文本(r.事件编号)}</b>${潮切.徽章(r.原因,"警")}</div>
            <div class="线">运单 ${潮切.安全文本(r.运单键)} · 事件时 ${潮切.安全文本(r.事件时)}</div>
            <div class="线">匣编号 ${r.编号} · 归档 ${账.归档行数 ?? 0} 行 · 现行 ${账.现行行数 ?? 0} 行</div>
            <div class="痕">${痕}</div>`;
          格.appendChild(卡);
        }
        const 概 = await 潮切.getJSON("/api/窗键幂等");
        document.getElementById("形").textContent = `当前策略：${概.当前形态说明}`;
        const tb = document.getElementById("对账表");
        const 迟 = 对账.filter(x => x.迟到行数 > 0);
        if (!迟.length) { tb.innerHTML = `<tr><td colspan="6">${潮切.空态("暂无迟到侧回执。")}</td></tr>`; }
        else for (const x of 迟) {
          tb.appendChild(潮切.行(`<td>${潮切.安全文本(x.事件编号)}</td><td>${x.现行行数}</td><td>${x.迟到行数}</td><td>${x.归档行数}</td><td>${潮切.形态徽章(x.形态标记)}</td><td>${潮切.安全文本(x.拒因 || x.归档键 || "首灌")}</td>`));
        }
      })();
      </script>

    </main>
  </div>
  <script>
  (async () => {
    try {
      const o = await 潮切.getJSON("/api/概览");
      const r = o.窗规 || {};
      const el = document.getElementById("侧窗号");
      const tm = document.getElementById("侧窗时");
      if (el) el.textContent = r["当前窗号"] || "—";
      if (tm) tm.textContent = `${r["窗起"] || ""} → ${r["窗止"] || ""}`;
    } catch (e) {}
  })();
  </script>
</body>
</html>
