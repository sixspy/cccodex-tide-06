<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>入窗缓冲 · 潮切</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <aside class="侧轨">
      <div class="侧牌">潮切</div>
      <div class="侧副">物流网点轨迹 · 事件时关窗管道<br/>不是双轨对拍，也不是开腿成对</div>
      <div class="窗条" id="侧窗条">
        <div class="标">当前窗</div>
        <div class="号" id="侧窗号">加载中</div>
        <div class="时" id="侧窗时">—</div>
      </div>
      <div class="时轴">
        <div class="点"><b>装载</b>观测点入流</div>
        <div class="点"><b>入窗</b>事件时进缓冲</div>
        <div class="点"><b>关窗</b>物化切片账</div>
        <div class="点"><b>贯验</b>缓冲↔切片互证</div>
      </div>
      
      <nav class="侧链">
        <a href="/" >潮切台</a>
        <a href="/观测流.html" >观测流</a>
        <a href="/入窗缓冲.html" class="亮">入窗缓冲</a>
        <a href="/窗切片账.html" >窗切片账</a>
        <a href="/迟到匣.html" >迟到匣</a>
        <a href="/窗贯验.html" >窗贯验</a>
        <a href="/网点源.html" >网点源</a>
        <a href="/窗规.html" >窗规</a>
      </nav>

    </aside>
    <main class="主区">
      <header class="页头">
        <h1>入窗缓冲</h1>
        <p>事件时落在当前窗、尚未关窗物化的在途集合。</p>
      </header>

      <section class="卷">
        <h2>缓冲详情</h2>
        <div class="表绕"><table><thead><tr><th>事件编号</th><th>运单键</th><th>窗号</th><th>事件时</th><th>命运</th><th>幂等痕迹</th></tr></thead><tbody id="表"></tbody></table></div>
      </section>
      <section class="卷">
        <h2>单号对账（只读）</h2>
        <div class="工具">
          <input id="查号" placeholder="输入事件编号" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px"/>
          <button class="按钮" id="查">查对账</button>
        </div>
        <div class="表绕"><table><thead><tr><th>事件编号</th><th>校验</th><th>装载批次</th><th>观测命运</th><th>缓冲命运</th><th>现行行数</th><th>归档行数</th><th>形态</th><th>拒因/归档键</th><th>valid</th></tr></thead><tbody id="对账表"></tbody></table></div>
      </section>
      <section class="卷"><div class="双栏"><p class="说明">缓冲是关窗前的在途。关窗后命运应变为已物化，条数应下降。重号被拒不会在缓冲多出第二行。</p><div class="侧注">版式：左侧窗时间轴。对拍是顶栏双轨，肉眼应能分开。</div></div></section>
      <script>
      async function 渲染对账(rows) {
        const tb = document.getElementById("对账表"); tb.innerHTML = "";
        if (!rows.length) { tb.innerHTML = `<tr><td colspan="10">${潮切.空态("无对账数据。")}</td></tr>`; return; }
        for (const x of rows) {
          tb.appendChild(潮切.行(`<td>${潮切.安全文本(x.事件编号)}</td><td>${潮切.安全文本(x.校验 || "—")}</td><td>${潮切.安全文本(x.装载批次 || "—")}</td><td>${潮切.安全文本(x.观测命运 || "—")}</td><td>${潮切.安全文本(x.缓冲命运 || "—")}</td><td>${x.现行行数}</td><td>${x.归档行数}</td><td>${潮切.形态徽章(x.形态标记)}</td><td>${潮切.安全文本(x.拒因 || x.归档键 || "首灌")}</td><td>${x.valid ? 潮切.徽章("valid","好") : 潮切.徽章("失效","危")}</td>`));
        }
      }
      (async () => {
        const rows = await 潮切.getJSON("/api/入窗缓冲");
        const tb = document.getElementById("表");
        const 对账 = await 潮切.幂等对账();
        const 账图 = Object.fromEntries(对账.map(x => [x.事件编号, x]));
        if (!rows.length) { tb.innerHTML = `<tr><td colspan="6">${潮切.空态("缓冲为空。要么尚未装载，要么已经关窗物化。")}</td></tr>`; return; }
        for (const r of rows) {
          const 账 = 账图[r.事件编号];
          tb.appendChild(潮切.行(`<td>${潮切.安全文本(r.事件编号)}</td><td>${潮切.安全文本(r.运单键)}</td><td>${潮切.安全文本(r.窗号)}</td><td>${潮切.安全文本(r.事件时)}</td><td>${潮切.徽章(r.命运)}</td><td>${账 ? 潮切.幂等摘要(账) : "—"}</td>`));
        }
      })();
      document.getElementById("查").onclick = async () => {
        const 号 = document.getElementById("查号").value.trim();
        await 渲染对账(await 潮切.幂等对账(号 || undefined));
      };
      渲染对账([]);
      </script>

    </main>
  </div>
  <script>
  (async () => {
    try {
      const o = await 潮切.getJSON("/api/概览");
      const r = o.窗规 || {};
      const el = document.getElementById("侧窗号");
      const tm = document.getElementById("侧窗时");
      if (el) el.textContent = r["当前窗号"] || "—";
      if (tm) tm.textContent = `${r["窗起"] || ""} → ${r["窗止"] || ""}`;
    } catch (e) {}
  })();
  </script>
</body>
</html>
